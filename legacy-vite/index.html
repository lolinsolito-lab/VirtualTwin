
<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Virtualtwin | Sovereign 3D Experience</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Outfit:wght@100;200;300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --gold: #D4AF37;
      --champagne: #F9F6F0;
      --silk: #FFFFFF;
      --charcoal: #1A1A1A;
      --glass: rgba(255, 255, 255, 0.7);
    }
    body {
      font-family: 'Outfit', sans-serif;
      background-color: var(--champagne);
      color: var(--charcoal);
      scroll-behavior: smooth;
      -webkit-font-smoothing: antialiased;
      perspective: 1500px;
    }
    .font-serif { font-family: 'Cormorant Garamond', serif; }
    
    .gold-gradient {
      background: linear-gradient(135deg, #D4AF37 0%, #F1D38A 50%, #B38B2D 100%);
    }

    /* 3D Utility Classes */
    .preserve-3d { transform-style: preserve-3d; }
    .depth-card {
      background: var(--glass);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 
        0 10px 30px -10px rgba(0,0,0,0.1),
        0 40px 80px -20px rgba(212, 175, 55, 0.05);
      transform: translateZ(20px);
      transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
    }
    .depth-card:hover {
      transform: translateZ(50px) rotateX(2deg) rotateY(-2deg);
      box-shadow: 
        0 20px 50px -15px rgba(0,0,0,0.15),
        0 60px 100px -30px rgba(212, 175, 55, 0.1);
    }

    /* Floating Animation */
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0); }
      50% { transform: translateY(-20px) rotate(1deg); }
    }
    .floating { animation: float 8s ease-in-out infinite; }

    /* Custom Cursor Aura */
    .aura {
      position: fixed;
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(212,175,55,0.03) 0%, transparent 70%);
      pointer-events: none;
      z-index: 1;
      transform: translate(-50%, -50%);
    }
  </style>
<script type="importmap">
{
  "imports": {
    "react": "https://esm.sh/react@19.0.0",
    "react-dom": "https://esm.sh/react-dom@19.0.0",
    "react-dom/client": "https://esm.sh/react-dom@19.0.0/client",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "react/": "https://esm.sh/react@^19.2.3/",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
<body>
  <div class="aura" id="aura"></div>
  <div id="root"></div>
  <script>
    const aura = document.getElementById('aura');
    document.addEventListener('mousemove', (e) => {
      aura.style.left = e.clientX + 'px';
      aura.style.top = e.clientY + 'px';
    });
  </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
